name: Bug report / گزارش خطا
description: Report a reproducible software issue / گزارش مشکل قابل بازتولید
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not post cookies, tokens, passwords, private board URLs or proxy credentials. / اطلاعات حساس را منتشر نکنید."
  - type: input
    id: version
    attributes:
      label: App version / نسخه نرم‌افزار
      placeholder: "2.4.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / سیستم‌عامل
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation type / نوع نصب
      options: [Source ZIP, Windows portable EXE, Updated source installation, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / مراحل بازتولید
      placeholder: "1. Open ...\n2. Paste an accessible board URL ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / انتظار شما
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / نتیجه واقعی
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / گزارش بدون اطلاعات حساس
      description: "Remove credentials and private content before sharing."
      render: text
  - type: checkboxes
    id: safe
    attributes:
      label: Privacy checklist / بررسی امنیت
      options:
        - label: I checked the log and removed any credentials or private account data.
          required: true
